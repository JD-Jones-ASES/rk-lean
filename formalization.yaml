version: "v0.4"

project:
  name: "rk-lean: the directed construction for k-th-power-difference-free sets at every k, with the exponents 0.912145 (k = 4) and 0.950826 (k = 6)"
  description: >-
    A Lean 4 proof of Krachun's directed (acyclic-block) lower-bound construction for sets of
    integers with no k-th-power difference, stated and proved for every exponent k >= 2. Let
    D_k(N) be the largest size of a subset of {1,...,N} no two of whose elements differ by a
    nonzero perfect k-th power. A pool for k is a nonempty list of blocks (m, sup, H) with
    pairwise coprime square-free moduli m >= 2, heights H >= 2, and sup a list of
    (vertex, rank) pairs with distinct vertices below m, ranks below H, and a strict rank drop
    along every ordered pair of vertices whose difference is a nonzero k-th-power residue mod m
    (so the induced digraph is acyclic). For every such pool,
    alpha k P <= liminf log D_k(N)/log N, where
    alpha k P = (sum ((k-1) log m + log t)/log H) / (1 + k sum log m / log H) and t is the number
    of vertices of a block; and N^rho <= D_k(N) for all large N whenever rho < alpha k P. The
    theorem is instantiated at k = 4 with nine blocks, eight on the primes 5, 13, 29, 37, 53, 61,
    101, 109 and one at the composite square-free modulus 51 = 3 * 17, and at k = 6 with nine
    blocks on the primes 7, 19, 31, 43, 67, 79, 103, 127, 139, giving the
    exponents 0.912145042700... and 0.950825559086..., each proved to exceed the corresponding
    Ruzsa transfer value ((3 + log 6/log 17)/4 = 0.908103119289... and
    (5 + log 6/log 13)/6 = 0.949759249243..., the latter being Ruzsa's own published Corollary at
    k = 6) and the decimal bounds 0.9121 and 0.9508, by exact comparisons of natural powers.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11B30", "11B75", "05C20"]

sources:
  - title: "Square-Difference-Free Sets beyond the Three-Quarter Barrier"
    authors: ["Dmitry Krachun"]
    id: "arXiv:2608.01325"
    type: "article"
    location: "https://arxiv.org/abs/2608.01325"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      v1, 2 Aug 2026; no journal reference as of 2026-09-12. His Definition 2 (Paley chain) and
      Lemma 3 (a local ranked block) are the ranked block formalized here as
      ValidRankedSupport / RankedBlock; his Lemma 4 (appending the rank as a high digit) and
      Lemma 5 (gluing coprime moduli by the Chinese remainder theorem) are generalized from the
      square to the k-th power and appear as lemmaB_pdf and lemmaC. The paper is k = 2
      throughout: its text contains no occurrence of "power", "cube", "fourth", "k-th" or "kth".
      His Theorem 1, the ten-pair optimisation giving 0.752796455875..., is a k = 2 statement and
      is not formalized here. The reading of a block as an acyclic digraph carried with a
      topological ranking is this development's reformulation and is not attributed to him.
  - title: "Difference sets without squares"
    authors: ["Imre Z. Ruzsa"]
    id: "doi:10.1007/BF02454169"
    type: "article"
    location: "https://doi.org/10.1007/BF02454169"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Periodica Mathematica Hungarica 15 (1984), no. 3, 205-209. Theorem 2 is the residue
      transfer for every k, D_k(x) >> m^{-1} x^{gamma(k,m)} with
      gamma(k,m) = 1 - 1/k + log r_k(m)/(k log m); its Corollary, at the least prime
      p = p(2k) congruent to 1 mod 2k, prints the instances d_3 >= 0.854858... and
      d_5 >= 0.934237..., and evaluates at k = 4, 6 to 0.872325... (p = 17) and 0.949759...
      (p = 13). The base-m digit method underlying Lemma A is his. Not formalized here: the
      transfer itself is not a theorem of this repository, only the two real numbers the
      exponents are compared against.
  - title: "Lower bounds in the polynomial Szemerédi theorem"
    authors: ["Khalid Younis"]
    id: "arXiv:1908.06058"
    type: "article"
    location: "https://arxiv.org/abs/1908.06058"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      v1, 16 Aug 2019; no journal reference listed as of 2026-09-12. His Theorem 1.4 (Ruzsa)
      states the general-k transfer in the form gamma = (k-1+log_m|R|)/k used throughout the
      documentation here, and his section 1 records Lewko's cube value. No numerical value for
      k >= 4 appears there.
  - title: "An improved lower bound related to the Furstenberg–Sárközy theorem"
    authors: ["Mark Lewko"]
    id: "doi:10.37236/4656"
    type: "article"
    location: "https://doi.org/10.37236/4656"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Electronic Journal of Combinatorics 22 (2015), no. 1, Paper P1.32. Theorem 3 is the k = 2
      transfer value 0.733412... at m = 205 with 12 residues; Theorem 4 is the best published
      exponent for cubes, 2/3 + log 14/(3 log 91) = 0.861681..., from 14 residues mod 91; Lemma 5
      is Ruzsa's transfer in the gamma(k,m) form. The census pattern for k-th-power-difference-free
      residue sets follows this paper. k = 3 is odd, where the directed method reduces to
      independent sets, so this value is not improved here.
  - title: "Square-Difference-Free Sets of Size Ω(n^0.7334...)"
    authors: ["Richard Beigel", "William Gasarch"]
    id: "arXiv:0804.4892"
    type: "article"
    location: "https://arxiv.org/abs/0804.4892"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The k = 2 transfer at m = 205 with 12 residues, 0.5(1 + log_205 12) = 0.733411797...; same
      search pattern. The arXiv abstract mis-states the exponent as 0.7443...; the title and body
      value is the correct one.
  - title: "On the Shannon capacity of a graph"
    authors: ["László Lovász"]
    id: "doi:10.1109/TIT.1979.1055985"
    type: "article"
    location: "https://doi.org/10.1109/TIT.1979.1055985"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      IEEE Transactions on Information Theory 25 (1979), no. 1, 1-7. The theta function bounding
      the independence number of the Cayley graph of Z/p on the k-th powers, which caps every
      independent-residue-set transfer at (k-1+c_k)/k. Cited in README.md as context only and
      explicitly outside the formal development: Mathlib has no theta function and no theorem
      here mentions it.
  - title: "Difference sets without κ-th powers"
    authors: ["Antal Balog", "József Pelikán", "János Pintz", "Endre Szemerédi"]
    id: "doi:10.1007/BF01874311"
    type: "article"
    location: "https://doi.org/10.1007/BF01874311"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Acta Mathematica Hungarica 65 (1994), no. 2, 165-187. The upper-bound side at general fixed
      k, extending Pintz, Steiger and Szemerédi (J. London Math. Soc. (2) 37 (1988), 219-231); the best known general-degree bound is Rice's maximal
      extension (Acta Arith. 187 (2019), 1-41, doi:10.4064/aa170828-26-8). Not formalized here.
  - title: "New bounds for the Furstenberg–Sárközy theorem"
    authors: ["Ben Green", "Mehtaab Sawhney"]
    id: "arXiv:2411.17448"
    type: "article"
    location: "https://arxiv.org/abs/2411.17448"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      v2, 10 Jan 2025. The best known upper bound at k = 2, |A| << N exp(-c sqrt(log N)); the
      other side of the problem, not formalized here. Several secondary sources render the title
      as "Improved bounds..."; the arXiv listing title is "New bounds...".
  - title: "fs-formal: a Lean formalization for the Furstenberg–Sárközy problem, exponent 0.7537 < alphaInf"
    authors: ["JD Jones"]
    id: "PALOMAR-2026-08-26-000004"
    type: "formalization"
    relationship: "prior-work"
    author_endorsement: "self"
    note: >-
      Registered 2026-08-26. The k = 2 case of the same construction: an eleven-block pool and
      the exponent 0.7537415..., proved to exceed Krachun's 0.752796455875.... This repository is
      the general-k development on that architecture; the eleven-block pool of that entry satisfies
      the pool conditions of the theorem proved here at k = 2 (not re-verified in this repository),
      and no k = 2 statement is re-derived.
  - title: "ry-lean: sets avoiding {x, x+y, x+y²} — Younis's two-set construction and the exponent 0.77028"
    authors: ["JD Jones"]
    id: "PALOMAR-2026-09-11-000003"
    type: "formalization"
    relationship: "prior-work"
    author_endorsement: "self"
    note: >-
      Registered 2026-09-11. A different configuration (nonlinear Roth, not k-th-power
      differences); cited as prior art in this problem area and as the pattern for the
      one-repository registry layout, the axiom audit and the source guard used here.

status:
  scope: >-
    Ten compared declarations over nine compared definitions. directed_liminf and
    directed_pointwise are the general theorem: for every k >= 2 and every pool for k (a nonempty
    list of blocks on pairwise coprime square-free moduli with a ranking strictly decreasing along
    every k-th-power-residue arc), alpha k P <= liminf log D_k(N)/log N, and N^rho <= D_k(N)
    eventually for every rho < alpha k P. pool4_valid and pool6_valid are the finite verifications
    of the two concrete pools. alpha4_gt_transfer, alpha4_gt, alpha6_gt_transfer and alpha6_gt are
    inequalities between real numbers defined by logarithms. fourth_power_liminf and
    sixth_power_liminf are the general theorem applied to the two pools. Nothing is claimed about
    upper bounds, about maximality of the supports or minimality of the heights, about optimality
    of the pools, or about the theta ceiling discussed as context in README.md. The intentional
    placeholders of Challenge.lean are excluded from proof counts; Solution.lean does not import
    Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "KthPower.directed_liminf"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "KthPower.directed_pointwise"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
