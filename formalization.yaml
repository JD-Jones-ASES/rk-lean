automation:
  methods:
    - method: "agent"
      models: ["Claude Fable 5.1 (Anthropic)", "Claude Opus (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        Claude Fable 5.1 planned the formalization, wrote the statements of Challenge.lean and the
        module architecture, and assembled the result; Claude Opus subagents wrote the Lean modules
        in parallel, searched the literature and the formalization registries, wrote the
        documentation, and audited the outcome for statement fidelity, axioms and documentation
        accuracy. Lean 4.33.0 and Mathlib v4.33.0 (commit db584cd6) are pinned and lake update is
        never run. The eighteen block verifications and the thirty-eight rational bounds on ratios
        of logarithms are ordinary decide, i.e. kernel arithmetic on natural-number literals;
        there is no decide +kernel and no native_decide in the repository. The blocks were found on
        one desktop machine on 2026-09-12 by CP-SAT, tabu search and an exact branch-and-bound that
        quotients by the multiplier symmetry of the k-th-power residues, except the block at
        51 = 3 * 17, which is an interval of 17 consecutive residues and needs no search; no solver
        is in the trust chain, since every block is re-verified in the Lean kernel by decide and
        again by a standard-library Python checker that reads nothing from the Lean sources.
      prompting_notes: >-
        The human operator selected the problem, required the theorem to be stated for a general
        exponent k with no parity condition, required exact (non-numerical) proofs of the exponent
        inequalities, required statement types free of instance diamonds, and required
        self-contained documentation with a dated prior-art statement.
  spend_usd: "not tracked"
  notes: "See DISCLOSURE.md. Prompt, token and monetary accounting was not retained."

fidelity:
  divergences: >-
    The compared theorem is stated for every k >= 2 with no parity condition, where the source is
    k = 2 throughout. The additive formulation of k-th-power-difference-freeness
    (a + z^k not in A for z > 0) covers both signs of a difference, so Lemma B needs no odd-k
    branch; at odd k, however, -1 = (-1)^k is a k-th-power residue, the arc relation is symmetric,
    every valid block is an independent set, and the theorem is then weaker than Ruzsa's transfer.
    The general theorem is therefore of interest at even k, and the two instances are at k = 4 and
    k = 6. Acyclicity of a block is not stated as a hypothesis: the ranking, which is an explicit
    part of the data, is equivalent to it, and a strictly decreasing ranking is what the proofs
    consume. The set of nonzero k-th-power residues is the full image of z -> z^k with 0 removed,
    non-units included; restricting to units would make the lift false. Sets of integers are
    Finset ℕ and residues are natural numbers below the modulus, so that every finite claim stays
    decidable; D k N is a supremum of Finset.card over the k-th-power-difference-free subsets of
    Finset.Icc 1 N, and no range is stated as an interval in ℤ (instance diamonds are avoided by
    stating ranges as bounds). ValidPool admits a block with an empty support, which the proof
    normalises away internally without changing the exponent. ValidPool asks its moduli to be
    square-free and pairwise coprime, not prime, and pool4 uses that latitude: its block at
    51 = 3 * 17 is an interval of 17 consecutive residues, acyclic because every backward
    difference along the interval exceeds the largest fourth-power residue mod 51, not because the
    arc relation is antisymmetric (it is not at 51). The general theorem at k >= 3 is new
    to this development — Krachun states k = 2 — and the two pools, hence the two exponents at
    k = 4 and k = 6, are new data appearing in no source.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is recorded. AI agents
    developed and cross-reviewed the proof; the statements were reviewed against the source text
    for dropped hypotheses and junk values, and against the prior-art report for every numerical
    comparison. VERIFICATION.md records the mechanical checks completed at this snapshot and
    states explicitly what is not checked (maximality of supports, minimality of heights,
    optimality of the pools, the two residue sets behind the transfer values, the theta ceiling,
    and the prior-art searches). Mechanical correctness and statement agreement do not establish
    priority, significance, or the correctness of any informal interpretation.

alignment:
  namespace: "KthPower"
  statements:
    - source: "Krachun, arXiv:2608.01325, Lemmas 3-5 and the construction behind Theorem 1, with the square replaced by a k-th power for general k >= 2"
      lean: "KthPower.directed_liminf"
      module: "Solution"
      status: "proved"
      note: >-
        Hypotheses: k >= 2 and ValidPool k P (nonempty list of blocks (m, sup, H); moduli pairwise
        coprime, each m >= 2 square-free; each H >= 2; each sup a list of (vertex, rank) pairs with
        distinct vertices below m, ranks below H, and rank(y) < rank(x) whenever the residue of
        y - x is a nonzero k-th-power residue mod m). Conclusion:
        alpha k P <= liminf log (D k N) / log N along atTop. Generalizes the source from k = 2; the
        general statement appears in no source.
    - source: "Krachun, arXiv:2608.01325, same construction, pointwise form; generalized to every k >= 2"
      lean: "KthPower.directed_pointwise"
      module: "Solution"
      status: "proved"
      note: >-
        Same hypotheses, plus rho < alpha k P. Conclusion: (N : ℝ)^rho <= D k N for all
        sufficiently large N (eventually along atTop), which is the >>_P N^{alpha - eps} form of
        the source.
    - source: "Not in any source: new instances. Nine blocks at k = 4 — eight on the primes 5, 13, 29, 37, 53, 61, 101, 109, all congruent to 5 mod 8, and one at the composite square-free modulus 51 = 3 * 17, an interval of 17 consecutive residues"
      lean: "KthPower.pool4_valid"
      module: "Solution"
      status: "proved"
      note: >-
        ValidPool 4 pool4, by decide on each of the nine blocks plus coprimality of the moduli and
        square-freeness (primality for the eight primes, the factorisation 3 * 17 for 51).
    - source: "Not in any source: new instances. Nine blocks on the primes 7, 19, 31, 43, 67, 79, 103, 127, 139, all congruent to 7 mod 12"
      lean: "KthPower.pool6_valid"
      module: "Solution"
      status: "proved"
      note: "ValidPool 6 pool6, by decide on each of the nine blocks plus coprimality and primality of the moduli."
    - source: "Comparison with the Ruzsa transfer value at k = 4 from six fourth-power-difference-free residues mod 17 (Ruzsa, doi:10.1007/BF02454169, Theorem 2; the six-element set mod 17 is exhibited in README.md and appears in no publication found)"
      lean: "KthPower.alpha4_gt_transfer"
      module: "Solution"
      status: "proved"
      note: >-
        (3 + log 6 / log 17) / 4 < alpha 4 pool4, i.e. 0.908103119289... < 0.912145042700...,
        proved from nine rational lower bounds, nine rational upper bounds and the bound
        log 6 / log 17 < 117/185, each a comparison of natural powers discharged by decide. The
        only published k = 4 value is Ruzsa's own Corollary 0.872325271059..., which is lower; the
        0.908103... rung is unpublished and this repository's own computation.
    - source: "Not in any source: decimal bound"
      lean: "KthPower.alpha4_gt"
      module: "Solution"
      status: "proved"
      note: "0.9121 < alpha 4 pool4; the rational assembly proves 0.912120556433... < alpha 4 pool4."
    - source: "Comparison with Ruzsa's own published Corollary at k = 6, p(12) = 13 (Ruzsa, doi:10.1007/BF02454169; the value 0.949759... is his, though he printed only the k = 3 and k = 5 instances)"
      lean: "KthPower.alpha6_gt_transfer"
      module: "Solution"
      status: "proved"
      note: >-
        (5 + log 6 / log 13) / 6 < alpha 6 pool6, i.e. 0.949759249243... < 0.950825559086...,
        proved from nine rational lower bounds, nine rational upper bounds and the bound
        log 6 / log 13 < 146/209, each a comparison of natural powers discharged by decide.
    - source: "Not in any source: decimal bound"
      lean: "KthPower.alpha6_gt"
      module: "Solution"
      status: "proved"
      note: "0.9508 < alpha 6 pool6; the rational assembly proves 0.950819216434... < alpha 6 pool6."
    - source: "Not in any source: the general theorem at the new k = 4 pool"
      lean: "KthPower.fourth_power_liminf"
      module: "Solution"
      status: "proved"
      note: "alpha 4 pool4 <= liminf log (D 4 N) / log N; directed_liminf applied to pool4_valid."
    - source: "Not in any source: the general theorem at the new k = 6 pool"
      lean: "KthPower.sixth_power_liminf"
      module: "Solution"
      status: "proved"
      note: "alpha 6 pool6 <= liminf log (D 6 N) / log N; directed_liminf applied to pool6_valid."

